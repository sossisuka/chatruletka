# Bootstrap configuration: HTTP-01 certificate validation for the user-provided IP.
# Install as a separate site; do not replace configurations for other domains.
server {
    listen 80;
    listen [::]:80;
    server_name 185.128.200.106;

    location /.well-known/acme-challenge/ {
        root /var/www/chatruletka-acme;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
