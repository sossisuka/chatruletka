# Install only after obtaining the chatruletka-ip certificate.
# Upstream must be reachable on this nginx server at 127.0.0.1:3005.
server {
    listen 80;
    listen [::]:80;
    server_name 185.128.200.106;

    location /.well-known/acme-challenge/ {
        root /var/www/chatruletka-acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://185.128.200.106$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 185.128.200.106;

    ssl_certificate /etc/letsencrypt/live/chatruletka-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatruletka-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
