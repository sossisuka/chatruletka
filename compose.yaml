services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-30}
      TWOIP_API_TOKEN: ${TWOIP_API_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      GOOGLE_SITE_VERIFICATION_FILE: ${GOOGLE_SITE_VERIFICATION_FILE:-}
      GOOGLE_SITE_VERIFICATION_CONTENT: ${GOOGLE_SITE_VERIFICATION_CONTENT:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  turn:
    image: coturn/coturn:4.18.0-r0
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command:
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=${TURN_REALM:-chatruletka}
      - --external-ip=${TURN_PUBLIC_IP:-}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49260
      - --no-multicast-peers
      - --no-tls

volumes:
  caddy_data:
  caddy_config:
